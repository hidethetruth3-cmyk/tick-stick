plugins { id 'fabric-loom' version '1.14-SNAPSHOT' }
version = '1.0.0'
base { archivesName = 'tickstick' }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.139.4+1.21.11'
}
processResources { filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
